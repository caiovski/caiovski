name: CaiOS Profile Telemetry Update

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *" # Runs daily at 04:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.README_STATS || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run CaiOS Telemetry Update
        env:
          README_STATS: ${{ secrets.README_STATS }}
          ACCESS_TOKEN: ${{ secrets.README_STATS || secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME || github.repository_owner }}
        run: python today.py

      - name: Commit and push changes
        run: |-
          git config --global user.email "bot@caiovski.terminal"
          git config --global user.name "CaiOS-Bot"
          git add dark_mode.svg light_mode.svg cache/
          git diff --staged --quiet || (git commit -m "chore(telemetry): update CaiOS terminal stats and uptime [skip ci]" && git push)
